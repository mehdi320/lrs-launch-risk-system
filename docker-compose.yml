services:
  app:
    build: .
    command: streamlit run app.py --server.port=8501 --server.address=0.0.0.0
    env_file: .env
    volumes:
      - lrs-data:/app/data
    environment:
      - LRS_USERS_DB_PATH=/app/data/.lrs_users.db
    ports:
      - "127.0.0.1:8501:8501"   # pas exposé directement, seul Caddy publie 80/443
    restart: unless-stopped

  webhook:
    build: .
    command: uvicorn webhook_server:app --host 0.0.0.0 --port 8000
    env_file: .env
    volumes:
      - lrs-data:/app/data
    environment:
      - LRS_USERS_DB_PATH=/app/data/.lrs_users.db
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    depends_on:
      - app
      - webhook
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped

volumes:
  lrs-data:
  caddy-data:
  caddy-config:
