<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Page introuvable — LRS™</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<meta name="robots" content="noindex, nofollow" />
<style>
  :root {
    --bg-gradient:
      radial-gradient(1200px circle at 12% -10%, rgba(0,122,255,0.16), transparent 55%),
      radial-gradient(1000px circle at 92% 6%, rgba(175,82,222,0.12), transparent 50%),
      radial-gradient(900px circle at 50% 108%, rgba(52,199,89,0.10), transparent 55%),
      #f5f5f7;
    --surface: rgba(255,255,255,0.70);
    --border: rgba(60,60,67,0.10);
    --text: #1d1d1f;
    --text-secondary: #6e6e73;
    --accent: #007aff;
    --glass-blur: blur(24px) saturate(180%);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; min-height: 100vh;
    background: var(--bg-gradient);
    background-attachment: fixed;
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text",
                 "Helvetica Neue", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex; align-items: center; justify-content: center;
  }
  .card {
    background: var(--surface);
    backdrop-filter: var(--glass-blur);
    -webkit-backdrop-filter: var(--glass-blur);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 48px 40px;
    text-align: center;
    max-width: 420px;
    margin: 24px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.06), 0 2px 8px rgba(0,0,0,0.04);
  }
  .emoji { font-size: 44px; margin-bottom: 14px; }
  h1 { font-size: 22px; font-weight: 700; margin: 0 0 8px; letter-spacing: -0.02em; }
  p { color: var(--text-secondary); font-size: 14px; line-height: 1.5; margin: 0 0 24px; }
  a.cta {
    display: inline-block;
    background: var(--accent);
    color: #fff;
    text-decoration: none;
    font-weight: 600;
    font-size: 15px;
    padding: 12px 24px;
    border-radius: 12px;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="emoji">🚦</div>
    <h1>Page introuvable</h1>
    <p>Cette page n'existe pas ou a été déplacée.</p>
    <a class="cta" href="/">← Retour à LRS™</a>
  </div>
</body>
</html>
