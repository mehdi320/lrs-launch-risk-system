<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>LRS — Pilote Audit</title>
<style>
  :root {
    --bg: #000000;
    --surface: #111114;
    --surface-2: #1c1c20;
    --border: rgba(255,255,255,0.09);
    --border-strong: rgba(255,255,255,0.16);
    --text: #f5f5f7;
    --text-secondary: #98989d;
    --text-muted: #6e6e73;
    --accent: #0a84ff;
    --accent-soft: rgba(10,132,255,0.14);
    --success: #30d158;
    --success-soft: rgba(48,209,88,0.14);
    --warning: #ff9f0a;
    --warning-soft: rgba(255,159,10,0.14);
    --danger: #ff453a;
    --danger-soft: rgba(255,69,58,0.14);
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text",
                 "Helvetica Neue", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 96px 24px 120px;
  }

  .wrap { width: 100%; max-width: 720px; }

  /* ── Header ── */
  .brand {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-bottom: 8px;
  }
  .brand .dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 14px var(--accent);
  }
  .brand span {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.02em;
    color: var(--text-secondary);
    text-transform: uppercase;
  }

  h1.hero {
    font-size: 48px;
    font-weight: 700;
    letter-spacing: -0.03em;
    text-align: center;
    margin: 0 0 12px;
    line-height: 1.08;
  }
  p.hero-sub {
    text-align: center;
    color: var(--text-secondary);
    font-size: 19px;
    line-height: 1.5;
    margin: 0 auto 56px;
    max-width: 480px;
  }

  /* ── Card ── */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 36px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }

  label.field-label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-muted);
    margin-bottom: 8px;
  }

  input[type="url"] {
    width: 100%;
    background: var(--surface-2);
    border: 1px solid var(--border-strong);
    border-radius: 14px;
    padding: 16px 18px;
    font-size: 17px;
    color: var(--text);
    outline: none;
    transition: border-color 0.2s var(--ease), box-shadow 0.2s var(--ease);
  }
  input[type="url"]::placeholder { color: var(--text-muted); }
  textarea {
    width: 100%;
    background: var(--surface-2);
    border: 1px solid var(--border-strong);
    border-radius: 14px;
    padding: 16px 18px;
    font-size: 16px;
    line-height: 1.5;
    color: var(--text);
    outline: none;
    resize: vertical;
    min-height: 100px;
    font-family: inherit;
    transition: border-color 0.2s var(--ease), box-shadow 0.2s var(--ease);
  }
  textarea::placeholder { color: var(--text-muted); }
  textarea:focus, input[type="url"]:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 4px var(--accent-soft);
  }

  .row { display: flex; gap: 12px; margin-top: 20px; }
  .row .field { flex: 1; }

  /* Segmented control (Apple-style pill toggle) */
  .segmented {
    display: flex;
    background: var(--surface-2);
    border: 1px solid var(--border-strong);
    border-radius: 12px;
    padding: 3px;
    gap: 2px;
  }
  .segmented button {
    flex: 1;
    border: none;
    background: transparent;
    color: var(--text-secondary);
    font-size: 13px;
    font-weight: 600;
    padding: 9px 8px;
    border-radius: 9px;
    cursor: pointer;
    transition: background 0.2s var(--ease), color 0.2s var(--ease);
    font-family: inherit;
  }
  .segmented button.active {
    background: var(--surface);
    color: var(--text);
    box-shadow: 0 1px 4px rgba(0,0,0,0.4);
  }

  button.cta {
    width: 100%;
    margin-top: 28px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 14px;
    padding: 17px;
    font-size: 17px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    transition: transform 0.15s var(--ease), background 0.2s var(--ease), opacity 0.2s var(--ease);
  }
  button.cta:hover { background: #2b95ff; }
  button.cta:active { transform: scale(0.98); }
  button.cta:disabled { opacity: 0.5; cursor: default; transform: none; }

  .error-box {
    margin-top: 18px;
    padding: 14px 16px;
    background: var(--danger-soft);
    border: 1px solid rgba(255,69,58,0.3);
    border-radius: 12px;
    font-size: 14px;
    color: #ffb4ae;
    display: none;
  }

  /* ── Loading state ── */
  .loading {
    display: none;
    flex-direction: column;
    align-items: center;
    padding: 64px 20px;
  }
  .loading .ring {
    width: 56px; height: 56px;
    border-radius: 50%;
    border: 3px solid var(--border-strong);
    border-top-color: var(--accent);
    animation: spin 0.9s linear infinite;
    margin-bottom: 28px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading .stage {
    font-size: 17px;
    font-weight: 500;
    color: var(--text-secondary);
    transition: opacity 0.3s var(--ease);
  }

  /* ── Results ── */
  .results { display: none; }
  .fade-up {
    animation: fadeUp 0.6s var(--ease) both;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .score-hero {
    text-align: center;
    padding: 56px 20px 44px;
  }
  .score-num {
    font-size: 96px;
    font-weight: 700;
    letter-spacing: -0.04em;
    line-height: 1;
  }
  .score-den { font-size: 28px; color: var(--text-muted); font-weight: 500; }
  .verdict-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin-top: 20px;
    padding: 8px 18px;
    border-radius: 100px;
    font-size: 15px;
    font-weight: 600;
  }
  .verdict-badge .pip { width: 8px; height: 8px; border-radius: 50%; }

  .section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 28px;
    margin-top: 16px;
  }
  .section h2 {
    font-size: 13px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-muted);
    margin: 0 0 20px;
  }

  .bar-row { margin-bottom: 18px; }
  .bar-row:last-child { margin-bottom: 0; }
  .bar-row .bar-top {
    display: flex; justify-content: space-between; align-items: baseline;
    margin-bottom: 8px;
  }
  .bar-row .bar-label { font-size: 15px; font-weight: 600; }
  .bar-row .bar-val { font-size: 15px; color: var(--text-secondary); }
  .bar-track {
    height: 8px;
    background: var(--surface-2);
    border-radius: 100px;
    overflow: hidden;
  }
  .bar-fill {
    height: 100%;
    border-radius: 100px;
    width: 0%;
    transition: width 1s var(--ease);
  }

  .reasons { margin: 0; padding: 0; list-style: none; }
  .reasons li {
    display: flex;
    gap: 12px;
    padding: 12px 0;
    border-top: 1px solid var(--border);
    font-size: 15px;
    line-height: 1.5;
    color: var(--text-secondary);
  }
  .reasons li:first-child { border-top: none; padding-top: 0; }
  .reasons li .num {
    flex-shrink: 0;
    width: 22px; height: 22px;
    border-radius: 50%;
    background: var(--surface-2);
    color: var(--text);
    font-size: 12px;
    font-weight: 700;
    display: flex; align-items: center; justify-content: center;
  }

  .priority-card {
    background: var(--accent-soft);
    border: 1px solid rgba(10,132,255,0.3);
    border-radius: 16px;
    padding: 20px;
  }
  .priority-card .tag {
    font-size: 11px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.06em; color: var(--accent); margin-bottom: 8px;
  }
  .priority-card .what { font-size: 17px; font-weight: 600; margin-bottom: 6px; }
  .priority-card .how { font-size: 14px; color: var(--text-secondary); line-height: 1.5; }
  .priority-card .meta { margin-top: 12px; font-size: 12px; color: var(--text-muted); }

  .rewrite-field { margin-bottom: 16px; }
  .rewrite-field:last-child { margin-bottom: 0; }
  .rewrite-field .rw-label {
    font-size: 11px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.06em; color: var(--text-muted); margin-bottom: 6px;
  }
  .rewrite-field .rw-val {
    font-size: 16px; line-height: 1.5;
    background: var(--surface-2);
    border-radius: 10px;
    padding: 12px 14px;
  }

  .restart-link {
    display: block;
    text-align: center;
    margin-top: 28px;
    color: var(--text-muted);
    font-size: 14px;
    cursor: pointer;
    background: none;
    border: none;
    font-family: inherit;
    width: 100%;
  }
  .restart-link:hover { color: var(--text-secondary); }

  .demo-link {
    display: block;
    text-align: center;
    margin-top: 18px;
    color: var(--text-muted);
    font-size: 13px;
    text-decoration: none;
  }
  .demo-link:hover { color: var(--text-secondary); }

  /* ── Nav tabs ── */
  .nav-tabs {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 4px;
    margin-bottom: 40px;
  }
  .nav-tab {
    background: none;
    border: none;
    color: var(--text-muted);
    font-size: 14px;
    font-weight: 600;
    padding: 8px 18px;
    border-radius: 100px;
    cursor: pointer;
    font-family: inherit;
    transition: background 0.2s var(--ease), color 0.2s var(--ease);
  }
  .nav-tab.active { background: var(--surface-2); color: var(--text); }
  .nav-tab:hover:not(.active) { color: var(--text-secondary); }

  /* ── Dashboard ── */
  .kpi-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
    gap: 12px;
    margin-bottom: 16px;
  }
  .kpi-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 18px 14px;
    text-align: center;
  }
  .kpi-card .kpi-label {
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em;
    color: var(--text-muted); margin-bottom: 6px;
  }
  .kpi-card .kpi-val { font-size: 28px; font-weight: 700; line-height: 1.1; }
  .kpi-card .kpi-sub { font-size: 11px; color: var(--text-muted); margin-top: 4px; }

  .streak-row { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
  .streak-row .streak-card {
    flex: 1; min-width: 140px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 16px; padding: 16px; text-align: center;
  }
  .streak-row .streak-label {
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em;
    color: var(--text-muted); margin-bottom: 6px;
  }
  .streak-row .streak-val { font-size: 22px; font-weight: 800; }
  .streak-row .streak-sub { font-size: 12px; color: var(--text-muted); margin-top: 4px; }

  .dash-section { margin-top: 28px; }
  .dash-section h2 {
    font-size: 13px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.06em; color: var(--text-muted); margin: 0 0 14px;
  }

  .list-row {
    display: flex; align-items: center; gap: 14px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    padding: 14px 18px; margin-bottom: 8px;
  }
  .list-row .lr-score { font-size: 19px; font-weight: 800; min-width: 46px; }
  .list-row .lr-body { flex: 1; min-width: 0; }
  .list-row .lr-title {
    font-size: 14px; font-weight: 600; color: var(--text);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .list-row .lr-meta { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
  .list-row .lr-tag { font-size: 12px; font-weight: 600; white-space: nowrap; flex-shrink: 0; }

  .empty-dash {
    text-align: center; padding: 64px 24px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 24px;
  }
  .empty-dash .emoji { font-size: 40px; margin-bottom: 14px; }
  .empty-dash .title { font-size: 17px; font-weight: 700; margin-bottom: 6px; }
  .empty-dash .sub { font-size: 14px; color: var(--text-secondary); }

  .sparkline-wrap {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 20px; padding: 20px 20px 12px;
  }

  /* ── Filtres (Historique) ── */
  .filter-bar {
    display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px;
  }
  .filter-bar input[type="text"] {
    flex: 2; min-width: 180px;
    background: var(--surface-2); border: 1px solid var(--border-strong);
    border-radius: 12px; padding: 12px 16px; font-size: 14px; color: var(--text);
    outline: none; font-family: inherit;
  }
  .filter-bar input[type="text"]::placeholder { color: var(--text-muted); }
  .filter-bar input[type="text"]:focus { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
  .filter-bar .segmented { flex: 1; min-width: 160px; }

  .stats-banner {
    display: flex; gap: 32px; flex-wrap: wrap;
    background: linear-gradient(135deg, #17171c, #101014);
    border: 1px solid var(--border);
    border-radius: 20px; padding: 22px 26px; margin-bottom: 20px;
  }
  .stats-banner .stat-label {
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em;
    color: var(--text-muted); margin-bottom: 4px;
  }
  .stats-banner .stat-val { font-size: 26px; font-weight: 800; line-height: 1.1; }
  .stats-banner .stat-sub { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

  /* ── Alertes (Suivi) ── */
  .alert-row {
    display: flex; align-items: center; gap: 14px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    padding: 16px 18px; margin-bottom: 8px;
    border-left: 3px solid var(--border);
  }
  .alert-row.up { border-left-color: var(--success); }
  .alert-row.down { border-left-color: var(--danger); }
  .alert-row .alert-icon { font-size: 20px; }
  .alert-row .alert-body { flex: 1; min-width: 0; }
  .alert-row .alert-title {
    font-size: 14px; font-weight: 600; color: var(--text);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .alert-row .alert-meta { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
  .alert-row .alert-delta { font-size: 18px; font-weight: 800; flex-shrink: 0; }

  /* ── Historique : ligne dépliable ── */
  .hist-row {
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    padding: 14px 18px; margin-bottom: 8px; cursor: pointer;
  }
  .hist-row .hist-top { display: flex; align-items: center; gap: 14px; }
  .hist-row .hist-score { font-size: 19px; font-weight: 800; min-width: 46px; }
  .hist-row .hist-body { flex: 1; min-width: 0; }
  .hist-row .hist-title {
    font-size: 14px; font-weight: 600; color: var(--text);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .hist-row .hist-meta { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
  .hist-row .hist-chevron { color: var(--text-muted); font-size: 12px; transition: transform 0.2s var(--ease); }
  .hist-row.open .hist-chevron { transform: rotate(90deg); }
  .hist-row .hist-detail {
    display: none; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border);
    grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 12px;
  }
  .hist-row.open .hist-detail { display: grid; }
  .hist-row .hist-detail .hd-label {
    font-size: 10px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); margin-bottom: 4px;
  }
  .hist-row .hist-detail .hd-val { font-size: 14px; font-weight: 600; color: var(--text); }

  /* ── Multi-Audit ── */
  .podium { display: flex; gap: 12px; margin: 20px 0; align-items: flex-end; }
  .podium .podium-card {
    flex: 1; text-align: center; border-radius: 16px; padding: 20px 14px;
    background: var(--surface); border: 2px solid var(--border);
  }
  .podium .podium-card.rank1 { border-color: #ffd700; order: 2; }
  .podium .podium-card.rank2 { border-color: #c0c0c0; order: 1; }
  .podium .podium-card.rank3 { border-color: #cd7f32; order: 3; }
  .podium .podium-medal { font-size: 26px; margin-bottom: 6px; }
  .podium .podium-url {
    font-size: 11px; color: var(--text-muted); margin-bottom: 6px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .podium .podium-score { font-size: 26px; font-weight: 800; }

  /* ── Ressources : checklist ── */
  .checklist-cat { margin-bottom: 22px; }
  .checklist-cat h3 {
    font-size: 13px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.06em; color: var(--text-muted); margin: 0 0 10px;
  }
  .checklist-item {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 0; font-size: 15px; color: var(--text); cursor: pointer;
  }
  .checklist-item input[type="checkbox"] {
    width: 20px; height: 20px; flex-shrink: 0; accent-color: var(--accent); cursor: pointer;
  }
  .checklist-item.checked span { color: var(--text-muted); text-decoration: line-through; }
  .checklist-progress-wrap {
    margin-bottom: 20px;
  }
  .progress-track {
    height: 10px; background: var(--surface-2); border-radius: 100px; overflow: hidden; margin-top: 8px;
  }
  .progress-fill { height: 100%; border-radius: 100px; transition: width 0.4s var(--ease); }
  .progress-msg {
    margin-top: 12px; padding: 12px 16px; border-radius: 12px; font-size: 14px; font-weight: 600;
  }

  /* ── Creative Studio ── */
  .angle-card {
    background: var(--surface-2); border-radius: 12px; padding: 16px; margin-bottom: 10px;
  }
  .angle-card .angle-title { font-size: 15px; font-weight: 700; margin-bottom: 4px; }
  .angle-card .angle-sub { font-size: 13px; color: var(--text-secondary); line-height: 1.5; }
  .hook-item {
    display: flex; gap: 10px; padding: 10px 0; border-top: 1px solid var(--border);
    font-size: 14px; color: var(--text);
  }
  .hook-item:first-child { border-top: none; }
  .hook-item .hook-tag {
    flex-shrink: 0; font-size: 10px; font-weight: 700; text-transform: uppercase;
    color: var(--accent); background: var(--accent-soft); padding: 3px 8px; border-radius: 100px;
    height: fit-content;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="brand"><span class="dot"></span><span>LRS — Pilote</span></div>

    <div class="nav-tabs" id="navTabs">
      <button class="nav-tab active" data-view="dashboard">Dashboard</button>
      <button class="nav-tab" data-view="audit">Audit</button>
      <button class="nav-tab" data-view="multi">Multi-Audit</button>
      <button class="nav-tab" data-view="suivi">Suivi</button>
      <button class="nav-tab" data-view="historique">Historique</button>
      <button class="nav-tab" data-view="ressources">Ressources</button>
      <button class="nav-tab" data-view="creative">Creative Studio</button>
    </div>

    <div id="dashboardView"></div>
    <div id="multiView" style="display:none"></div>
    <div id="suiviView" style="display:none"></div>
    <div id="historiqueView" style="display:none"></div>
    <div id="ressourcesView" style="display:none"></div>
    <div id="creativeView" style="display:none"></div>

    <div id="auditView" style="display:none">
    <div id="heroText">
      <h1 class="hero">Votre landing page,<br/>évaluée en 15 secondes.</h1>
      <p class="hero-sub">Collez une URL. LRS analyse le hook, l'offre, la confiance et la friction — et vous dit exactement quoi corriger avant de dépenser en pub.</p>
    </div>

    <div class="card" id="formCard">
      <div class="field" style="margin-bottom:20px">
        <label class="field-label">Mode</label>
        <div class="segmented" id="modeSeg">
          <button class="active" data-val="Funnel Only">Funnel Only</button>
          <button data-val="Ads Only">Ads Only</button>
          <button data-val="Full Risk">Full Risk</button>
        </div>
      </div>

      <div class="field" id="urlField">
        <label class="field-label" for="url">URL de la landing page</label>
        <input type="url" id="url" placeholder="https://votre-page.com" autocomplete="off" />
      </div>

      <div class="field" id="adTextField" style="display:none;margin-top:20px">

<script>
const $ = (sel, root=document) => root.querySelector(sel);
const $$ = (sel, root=document) => Array.from(root.querySelectorAll(sel));

function setupSegmented(id) {
  const el = $('#' + id);
  el.addEventListener('click', (e) => {
    const btn = e.target.closest('button');
    if (!btn) return;
    $$('button', el).forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  });
}
['modeSeg', 'platformSeg', 'offerSeg', 'brandSeg'].forEach(setupSegmented);

// ── Navigation entre onglets ──────────────────────────
const VIEW_IDS = {
  dashboard: 'dashboardView',
  audit: 'auditView',
  multi: 'multiView',
  suivi: 'suiviView',
  historique: 'historiqueView',
  ressources: 'ressourcesView',
  creative: 'creativeView',
};

function setupNavTabs() {
  const nav = $('#navTabs');
  nav.addEventListener('click', (e) => {
    const btn = e.target.closest('button');
    if (!btn) return;
    $$('button', nav).forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const view = btn.dataset.view;
    Object.entries(VIEW_IDS).forEach(([v, id]) => {
      $('#' + id).style.display = (v === view) ? 'block' : 'none';
    });
    if (view === 'dashboard') loadDashboard();
    if (view === 'multi') renderMulti();
    if (view === 'suivi') loadSuivi();
    if (view === 'historique') loadHistorique();
    if (view === 'ressources') renderRessources();
    if (view === 'creative') renderCreative();
  });
}
setupNavTabs();

// ── Dashboard ──────────────────────────────────────────
function scoreEmoji(score) {
  if (score <= 9) return '🔴';
  if (score <= 14) return '🟡';
  return '🟢';
}
function scoreHex(score) {
  if (score <= 9) return '#ff453a';
  if (score <= 14) return '#ff9f0a';
  return '#30d158';
}

function buildSparkline(points) {
  const w = 640, h = 120, pad = 10;
  const maxScore = 20;
  const stepX = points.length > 1 ? (w - pad * 2) / (points.length - 1) : 0;
  const coords = points.map((p, i) => [
    pad + i * stepX,
    pad + (1 - p.score / maxScore) * (h - pad * 2),
  ]);
  const path = coords.map(([x, y], i) => (i === 0 ? 'M' : 'L') + x.toFixed(1) + ',' + y.toFixed(1)).join(' ');
  const dots = coords.map(([x, y], i) =>
    `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3.5" fill="${scoreHex(points[i].score)}" />`
  ).join('');
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" preserveAspectRatio="none">
    <path d="${path}" fill="none" stroke="#0a84ff" stroke-width="2.5" vector-effect="non-scaling-stroke" />
    ${dots}
  </svg>`;
}

function renderDashboardEmpty() {
  $('#dashboardView').innerHTML = `
    <div class="empty-dash fade-up">
      <div class="emoji">🚀</div>
      <div class="title">Aucun audit pour l'instant</div>
      <div class="sub">Lancez votre premier audit dans l'onglet Audit.</div>
    </div>
  `;
}

function renderDashboard(d) {
  if (!d.total_audits) { renderDashboardEmpty(); return; }

  const kpis = [
    ['Audits total', d.total_audits, '', 'var(--text)'],
    ['Score moyen', d.avg_score + '/20', '', scoreColor(d.avg_score)],
    ['Meilleur score', d.best_score + '/20', '', 'var(--success)'],
    ['Pages en danger', d.danger_count, 'score ≤ 9', 'var(--danger)'],
    ['Prêtes à scaler', d.ready_count, 'score ≥ 15', 'var(--success)'],
  ];
  const kpiHtml = kpis.map(([label, val, sub, color]) => `
    <div class="kpi-card">
      <div class="kpi-label">${label}</div>
      <div class="kpi-val" style="color:${color}">${val}</div>
      <div class="kpi-sub">${sub}</div>
    </div>
  `).join('');

  let streakHtml = '';
  if (d.streak_days > 0 || d.next_gap > 0) {
    streakHtml = '<div class="streak-row">';
    if (d.streak_days > 0) {
      streakHtml += `
        <div class="streak-card">
          <div class="streak-label">Streak</div>
          <div class="streak-val" style="color:var(--warning)">${d.streak_days >= 3 ? '🔥' : '⚡'} ${d.streak_days}j</div>
          <div class="streak-sub">consécutifs</div>
        </div>`;
    }
    if (d.next_gap > 0) {
      streakHtml += `
        <div class="streak-card">
          <div class="streak-label">Prochain objectif</div>
          <div class="streak-val" style="color:var(--accent)">+${d.next_gap} pts</div>
          <div class="streak-sub">${escapeHtml(d.next_label)}</div>
        </div>`;
    }
    streakHtml += '</div>';
  }

  const dangerHtml = d.danger_pages.length ? `
    <div class="dash-section fade-up">
      <h2>🔴 Pages en danger immédiat (${d.danger_pages.length})</h2>
      ${d.danger_pages.map(p => `
        <div class="list-row">
          <span class="lr-score" style="color:var(--danger)">${p.score}/20</span>
          <div class="lr-body">
            <div class="lr-title">${escapeHtml(p.label)}</div>
            <div class="lr-meta">${escapeHtml(p.timestamp)}</div>
          </div>
        </div>
      `).join('')}
    </div>` : '';

  const evoHtml = d.evolution.length >= 3 ? `
    <div class="dash-section fade-up">
      <h2>📈 Évolution des scores (derniers ${d.evolution.length} audits)</h2>
      <div class="sparkline-wrap">${buildSparkline(d.evolution)}</div>
    </div>` : '';

  const recentHtml = d.recent_audits.length ? `
    <div class="dash-section fade-up">
      <h2>🕒 Derniers audits</h2>
      ${d.recent_audits.map(e => `
        <div class="list-row">
          <span>${scoreEmoji(e.score)}</span>
          <span class="lr-score" style="color:${scoreColor(e.score)}">${e.score}/20</span>
          <div class="lr-body">
            <div class="lr-title">${escapeHtml(e.label)}</div>
            <div class="lr-meta">${escapeHtml(e.timestamp)} · ${escapeHtml(e.mode)} · ${escapeHtml(e.platform)}</div>
          </div>
          <span class="lr-tag" style="color:${scoreColor(e.score)}">${escapeHtml(e.decision)}</span>
        </div>
      `).join('')}
    </div>` : '';

  $('#dashboardView').innerHTML = `
    <div class="fade-up"><div class="kpi-grid">${kpiHtml}</div></div>
    ${streakHtml}
    ${dangerHtml}
    ${evoHtml}
    ${recentHtml}
  `;
}

async function loadDashboard() {
  try {
    const res = await fetch('/api/dashboard');
    const data = await res.json();
    renderDashboard(data);
  } catch (err) {
    $('#dashboardView').innerHTML =
      `<div class="error-box" style="display:block">Impossible de charger le dashboard : ${escapeHtml(err.message)}</div>`;
  }
}

async function runBulkAudit() {
  const urls = $('#bulkUrls').value.split('\n').map(u => u.trim()).filter(u => u.startsWith('http'));
  const errBox = $('#bulkErrorBox');
  errBox.style.display = 'none';
  if (!urls.length) {
    errBox.textContent = 'Merci de coller au moins une URL valide (commençant par http).';
    errBox.style.display = 'block';
    return;
  }
  $('#bulkRunBtn').disabled = true;
  $('#bulkLoadingBox').style.display = 'flex';
  $('#bulkResults').innerHTML = '';

  try {
    const res = await fetch('/api/bulk-audit', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        urls,
        mode: getSegVal('bulkModeSeg'),
        platform: getSegVal('bulkPlatformSeg'),
        offer_type: getSegVal('bulkOfferSeg'),
        brand_type: getSegVal('bulkBrandSeg'),
      }),
    });
    const data = await res.json();
    $('#bulkLoadingBox').style.display = 'none';
    $('#bulkRunBtn').disabled = false;
    if (!res.ok) {
      errBox.textContent = data.detail || 'Erreur inconnue.';
      errBox.style.display = 'block';
      return;
    }
    renderBulkResults(data.results || []);
  } catch (err) {
    $('#bulkLoadingBox').style.display = 'none';
    $('#bulkRunBtn').disabled = false;
    errBox.textContent = 'Erreur réseau : ' + err.message;
    errBox.style.display = 'block';
  }
}

function renderBulkResults(results) {
  const ok = results.filter(r => r.score !== null);
  const errors = results.filter(r => r.score === null);

  let podiumHtml = '';
  if (ok.length >= 3) {
    const medals = [['rank1', '🥇'], ['rank2', '🥈'], ['rank3', '🥉']];
    podiumHtml = `<div class="podium">` + ok.slice(0, 3).map((r, i) => `
      <div class="podium-card ${medals[i][0]}">
        <div class="podium-medal">${medals[i][1]}</div>
        <div class="podium-url">${escapeHtml(r.url.replace('https://', '').replace('http://', ''))}</div>
        <div class="podium-score" style="color:${scoreColor(r.score)}">${r.score}<span style="color:var(--text-muted);font-size:14px">/20</span></div>
      </div>
    `).join('') + `</div>`;
  }

  const listHtml = ok.map((r, i) => `
    <div class="list-row">
      <span class="lr-score" style="color:${scoreColor(r.score)}">${i + 1}. ${r.score}/20</span>
      <div class="lr-body">
        <div class="lr-title">${escapeHtml(r.url)}</div>
        <div class="lr-meta">Hook ${r.hook}/5 · Offer ${r.offer}/5 · Trust ${r.trust}/5 · Friction ${r.friction}/5</div>
      </div>
      <span class="lr-tag" style="color:${scoreColor(r.score)}">${escapeHtml(r.decision)}</span>
    </div>
  `).join('');

  const errorsHtml = errors.length ? `
    <div class="dash-section">
      <h2>⚠️ Échecs (${errors.length})</h2>
      ${errors.map(r => `
        <div class="list-row">
          <div class="lr-body">
            <div class="lr-title">${escapeHtml(r.url)}</div>
            <div class="lr-meta" style="color:var(--danger)">${escapeHtml(r.error || 'Erreur inconnue')}</div>
          </div>
        </div>
      `).join('')}
    </div>` : '';

  $('#bulkResults').innerHTML = `
    <div class="dash-section fade-up">
      <h2>Résultats — ${results.length} page(s) auditée(s)</h2>
      ${podiumHtml}
      ${listHtml}
    </div>
    ${errorsHtml}
  `;
}

let _histFilterTimer = null;

function renderHistoriqueShell() {

async function loadHistorique() {
  if (!$('#histContent')) renderHistoriqueShell();
  const q = $('#histSearch').value;
  const risk = getSegVal('histRiskSeg');
  const platform = getSegVal('histPlatformSeg');
  $('#histContent').innerHTML = `<div class="empty-dash"><div class="emoji">⏳</div><div class="title">Chargement…</div></div>`;
  try {
    const params = new URLSearchParams({ q, risk, platform });
    const res = await fetch('/api/history?' + params.toString());
    const data = await res.json();
    renderHistorique(data);
  } catch (err) {
    $('#histContent').innerHTML = `<div class="error-box" style="display:block">Impossible de charger l'historique : ${escapeHtml(err.message)}</div>`;
  }
}

function renderHistorique(data) {
  const entries = data.entries || [];
  if (!entries.length) {
    $('#histContent').innerHTML = `
      <div class="empty-dash fade-up">
        <div class="emoji">🗂️</div>
        <div class="title">Aucun audit ne correspond</div>
        <div class="sub">Essayez d'autres filtres, ou lancez votre premier audit.</div>
      </div>
    `;
    return;
  }

  let statsHtml = '';
  if (data.stats) {
    const d = data.stats.delta_global;
    const dColor = d > 0 ? 'var(--success)' : d < 0 ? 'var(--danger)' : 'var(--text-muted)';
    statsHtml = `
      <div class="stats-banner fade-up">
        <div>
          <div class="stat-label">Progression globale</div>
          <div class="stat-val" style="color:${dColor}">${d >= 0 ? '+' : ''}${d} pts</div>
          <div class="stat-sub">depuis le premier audit (filtré)</div>
        </div>
        <div>
          <div class="stat-label">Score moyen</div>
          <div class="stat-val" style="color:var(--accent)">${data.stats.avg_score}<span style="color:var(--text-muted);font-size:16px">/20</span></div>
        </div>
        <div>
          <div class="stat-label">Total audits</div>
          <div class="stat-val">${data.stats.total}</div>
        </div>
      </div>
    `;
  }

  const evoHtml = (data.evolution || []).length >= 2 ? `
    <div class="sparkline-wrap fade-up" style="margin-bottom:20px">${buildSparkline(data.evolution)}</div>
  ` : '';

  const rowsHtml = entries.map((e, i) => `
    <div class="hist-row fade-up" data-idx="${i}">
      <div class="hist-top">
        <span class="hist-score" style="color:${scoreColor(e.score)}">${e.score}/20</span>
        <div class="hist-body">
          <div class="hist-title">${escapeHtml(e.url || e.offer_type || '')}</div>
          <div class="hist-meta">${escapeHtml(e.timestamp)} · ${escapeHtml(e.mode)}${e.delta !== null ? ` · <span style="color:${e.delta > 0 ? 'var(--success)' : e.delta < 0 ? 'var(--danger)' : 'var(--text-muted)'}">(${e.delta > 0 ? '+' : ''}${e.delta})</span>` : ''}</div>
        </div>
        <span class="hist-chevron">▶</span>
      </div>
      <div class="hist-detail">
        <div><div class="hd-label">Décision</div><div class="hd-val" style="color:${scoreColor(e.score)}">${escapeHtml(e.decision)}</div></div>
        <div><div class="hd-label">Plateforme</div><div class="hd-val">${escapeHtml(e.platform)}</div></div>
        <div><div class="hd-label">Risque</div><div class="hd-val">${escapeHtml(e.risk)}</div></div>
        <div><div class="hd-label">vs précédent</div><div class="hd-val">${e.delta !== null ? (e.delta > 0 ? '+' : '') + e.delta + ' pts' : '—'}</div></div>
      </div>
    </div>
  `).join('');

  $('#histContent').innerHTML = statsHtml + evoHtml + rowsHtml;
  $$('.hist-row', $('#histContent')).forEach(row => {
    row.addEventListener('click', () => row.classList.toggle('open'));
  });
}

function saveChecklistState(state) {
  try {
    localStorage.setItem(CHECKLIST_STORAGE_KEY, JSON.stringify(state));
  } catch (e) {}
}

function renderRessources() {
  const state = loadChecklistState();

  const catsHtml = CHECKLIST_DATA.map(([cat, items]) => `
    <div class="checklist-cat">
      <h3>${escapeHtml(cat)}</h3>
      ${items.map(item => {
        const checked = !!state[item];
        return `
          <label class="checklist-item ${checked ? 'checked' : ''}">
            <input type="checkbox" data-item="${escapeHtml(item)}" ${checked ? 'checked' : ''} />
            <span>${escapeHtml(item)}</span>
          </label>
        `;
      }).join('')}
    </div>
  `).join('');

  $('#ressourcesView').innerHTML = `
    <div class="checklist-progress-wrap">
      <div class="field-label" style="margin-bottom:0">Checklist pré-lancement</div>
      <div id="checklistProgressBody"></div>
    </div>
    <div class="card">${catsHtml}</div>
  `;
  updateChecklistProgress();

  $$('#ressourcesView .checklist-item input[type="checkbox"]').forEach(cb => {
    cb.addEventListener('change', () => {
      const state = loadChecklistState();
      state[cb.dataset.item] = cb.checked;
      saveChecklistState(state);
      cb.closest('.checklist-item').classList.toggle('checked', cb.checked);
      updateChecklistProgress();
    });
  });
}

function updateChecklistProgress() {
  const state = loadChecklistState();
  const totalItems = CHECKLIST_DATA.reduce((sum, [, items]) => sum + items.length, 0);
  const checked = CHECKLIST_DATA.reduce((sum, [, items]) => sum + items.filter(i => state[i]).length, 0);
  const pct = totalItems ? Math.round(checked / totalItems * 100) : 0;
  const color = pct < 50 ? 'var(--danger)' : pct < 80 ? 'var(--warning)' : 'var(--success)';
  const msg = pct < 50
    ? "Moins de 50% — ne lancez pas encore."
    : pct < 80
    ? "Entre 50 et 80% — testez en petit budget."
    : "80%+ — fondamentaux solides, vous pouvez lancer.";

  $('#checklistProgressBody').innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:baseline;margin-top:6px">
      <span style="font-size:14px;color:var(--text-secondary)">${checked}/${totalItems} complétés</span>
      <span style="font-size:20px;font-weight:800;color:${color}">${pct}%</span>
    </div>
    <div class="progress-track"><div class="progress-fill" style="width:${pct}%;background:${color}"></div></div>
    <div class="progress-msg" style="background:${color}22;color:${color}">${msg}</div>
  `;
}

            <button class="active" data-val="Meta">Meta</button>
            <button data-val="TikTok">TikTok</button>

        </div>

  `;

async function runCreativeAngles() {
  const offerDescription = $('#creativeOffer').value.trim();
  const errBox = $('#creativeErrorBox');
  errBox.style.display = 'none';
  if (!offerDescription) {
    errBox.textContent = 'Merci de décrire votre offre.';
    errBox.style.display = 'block';
    return;
  }
  $('#creativeRunBtn').disabled = true;
  $('#creativeLoadingBox').style.display = 'flex';
  $('#creativeResults').innerHTML = '';

  try {
    const res = await fetch('/api/creative-angles', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        offer_description: offerDescription,
        platform: getSegVal('creativePlatformSeg'),
        offer_type: getSegVal('creativeOfferSeg'),
      }),
    });
    const data = await res.json();
    $('#creativeLoadingBox').style.display = 'none';
    $('#creativeRunBtn').disabled = false;
    if (!res.ok) {
      errBox.textContent = data.detail || 'Erreur inconnue.';
      errBox.style.display = 'block';
      return;
    }
    renderCreativeResults(data);
  } catch (err) {
    $('#creativeLoadingBox').style.display = 'none';
    $('#creativeRunBtn').disabled = false;
    errBox.textContent = 'Erreur réseau : ' + err.message;
    errBox.style.display = 'block';
  }
}

function getSegVal(id) {
  return $('#' + id + ' button.active').dataset.val;
}

function updateFieldsForMode() {
  const mode = getSegVal('modeSeg');
  $('#urlField').style.display = (mode === 'Ads Only') ? 'none' : 'block';
  $('#adTextField').style.display = (mode === 'Funnel Only') ? 'none' : 'block';
}
$('#modeSeg').addEventListener('click', updateFieldsForMode);
updateFieldsForMode();

const LOADING_STAGES_BY_MODE = {
  "Funnel Only": ["Lecture de la page…", "Analyse du hook…", "Évaluation de l'offre…",
                  "Vérification des preuves de confiance…", "Calcul du score final…"],
  "Ads Only": ["Lecture de la publicité…", "Analyse du hook…", "Évaluation de l'offre…",
               "Vérification de la cohérence…", "Calcul du score final…"],
  "Full Risk": ["Lecture de la page et de la publicité…", "Analyse du hook…", "Évaluation de l'offre…",
                "Vérification du message match…", "Calcul du score final…"],
};

let loadingTimer = null;
function startLoadingAnimation(mode) {
  const stages = LOADING_STAGES_BY_MODE[mode] || LOADING_STAGES_BY_MODE["Funnel Only"];
  const stageEl = $('#loadingStage');
  let i = 0;
  stageEl.textContent = stages[0];
  loadingTimer = setInterval(() => {
    i = (i + 1) % stages.length;
    stageEl.style.opacity = 0;
    setTimeout(() => {
      stageEl.textContent = stages[i];
      stageEl.style.opacity = 1;
    }, 300);
  }, 2200);
}
function stopLoadingAnimation() {
  if (loadingTimer) clearInterval(loadingTimer);
  loadingTimer = null;
}

function showError(msg) {
  const box = $('#errorBox');
  box.textContent = msg;
  box.style.display = 'block';
}
function hideError() {
  $('#errorBox').style.display = 'none';
}

function scoreColor(score) {
  if (score <= 9) return 'var(--danger)';
  if (score <= 14) return 'var(--warning)';
  return 'var(--success)';
}
function scoreSoft(score) {
  if (score <= 9) return 'var(--danger-soft)';
  if (score <= 14) return 'var(--warning-soft)';
  return 'var(--success-soft)';
}

function renderResults(data) {
  const c = data._c || {};
  const why = data.why_this_score || {};
  const fp = data.fix_plan || {};
  const rw = data.rewrite || {};
  const color = scoreColor(c.score);
  const soft = scoreSoft(c.score);

  const bars = [
    ['Hook', c.hook], ['Offer', c.offer], ['Trust', c.trust], ['Friction', c.friction]
  ];

  const reasonsHtml = (why.top_3_reasons || []).map((r, i) => `
    <li><span class="num">${i + 1}</span><span>${escapeHtml(r)}</span></li>
  `).join('');

  const quickWins = (fp.quick_wins || []).slice(0, 3);
  const quickWinsHtml = quickWins.map(qw => `
    <li><span class="num">✓</span><span><strong>${escapeHtml(qw.what || '')}</strong><br/>${escapeHtml(qw.how_exactly || '')}</span></li>
  `).join('');

  const topAction = fp.top_priority_action || {};

  $('#results').innerHTML = `
    <div class="score-hero fade-up">
      <div class="score-num" style="color:${color}">${c.score}<span class="score-den">/20</span></div>
      <div class="verdict-badge" style="background:${soft};color:${color}">
        <span class="pip" style="background:${color}"></span>
        ${escapeHtml(c.decision || '')}
      </div>
    </div>

    <div class="section fade-up" style="animation-delay:0.05s">
      <h2>Score détaillé</h2>
      ${bars.map(([label, val]) => `
        <div class="bar-row">
          <div class="bar-top">
            <span class="bar-label">${label}</span>
            <span class="bar-val">${val}/5</span>
          </div>
          <div class="bar-track"><div class="bar-fill" data-w="${(val/5*100)}" style="background:${scoreColor(val <= 2 ? 9 : val === 3 ? 12 : 20)}"></div></div>
        </div>
      `).join('')}
    </div>

    ${reasonsHtml ? `
    <div class="section fade-up" style="animation-delay:0.1s">
      <h2>Pourquoi ce score</h2>
      <ul class="reasons">${reasonsHtml}</ul>
    </div>` : ''}

    ${topAction.what ? `
    <div class="section fade-up" style="animation-delay:0.15s">
      <h2>Action prioritaire</h2>
      <div class="priority-card">
        <div class="tag">Impact maximal</div>
        <div class="what">${escapeHtml(topAction.what)}</div>
        <div class="how">${escapeHtml(topAction.how_exactly || '')}</div>
        ${topAction.time_estimate ? `<div class="meta">⏱ ${escapeHtml(topAction.time_estimate)}</div>` : ''}
      </div>
    </div>` : ''}

    ${quickWinsHtml ? `
    <div class="section fade-up" style="animation-delay:0.2s">
      <h2>Quick wins</h2>
      <ul class="reasons">${quickWinsHtml}</ul>
    </div>` : ''}

    ${(rw.headline || rw.cta_primary) ? `
    <div class="section fade-up" style="animation-delay:0.25s">
      <h2>Rewrite suggéré</h2>
      ${rw.headline ? `<div class="rewrite-field"><div class="rw-label">Headline</div><div class="rw-val">${escapeHtml(rw.headline)}</div></div>` : ''}
      ${rw.subheadline ? `<div class="rewrite-field"><div class="rw-label">Sous-titre</div><div class="rw-val">${escapeHtml(rw.subheadline)}</div></div>` : ''}
      ${rw.cta_primary ? `<div class="rewrite-field"><div class="rw-label">CTA</div><div class="rw-val">${escapeHtml(rw.cta_primary)}</div></div>` : ''}
      ${rw.guarantee ? `<div class="rewrite-field"><div class="rw-label">Garantie</div><div class="rw-val">${escapeHtml(rw.guarantee)}</div></div>` : ''}
    </div>` : ''}

    <button class="restart-link" id="restartBtn">← Nouvel audit</button>
  `;

  $('#results').style.display = 'block';
  requestAnimationFrame(() => {
    $$('.bar-fill').forEach(el => { el.style.width = el.dataset.w + '%'; });
  });
  $('#restartBtn').addEventListener('click', resetToForm);
}

function escapeHtml(str) {
  const d = document.createElement('div');
  d.textContent = str == null ? '' : String(str);
  return d.innerHTML;
}

function resetToForm() {
  $('#results').style.display = 'none';
  $('#results').innerHTML = '';
  $('#formCard').style.display = 'block';
  $('#heroText').style.display = 'block';
  hideError();
}

async function runAudit() {
  const mode = getSegVal('modeSeg');
  const url = $('#url').value.trim();
  const adText = $('#adText').value.trim();

  if (mode !== 'Ads Only' && !url) { showError('Merci de renseigner une URL.'); return; }
  if (mode !== 'Funnel Only' && !adText) { showError('Merci de coller le texte de votre publicité.'); return; }
  hideError();

  $('#formCard').style.display = 'none';
  $('#heroText').style.display = 'none';
  $('#loadingBox').style.display = 'flex';
  startLoadingAnimation(mode);

  try {
    const res = await fetch('/api/audit', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        mode,
        url,
        ad_text: adText,
        platform: getSegVal('platformSeg'),
        offer_type: getSegVal('offerSeg'),
        brand_type: getSegVal('brandSeg'),
      }),
    });
    const data = await res.json();
    stopLoadingAnimation();
    $('#loadingBox').style.display = 'none';

    if (!res.ok) {
      $('#formCard').style.display = 'block';
      $('#heroText').style.display = 'block';
      showError(data.detail || 'Erreur inconnue.');
      return;
    }
    renderResults(data);
  } catch (err) {
    stopLoadingAnimation();
    $('#loadingBox').style.display = 'none';
    $('#formCard').style.display = 'block';
    $('#heroText').style.display = 'block';
    showError('Erreur réseau : ' + err.message);
  }
}

$('#runBtn').addEventListener('click', runAudit);
$('#url').addEventListener('keydown', (e) => { if (e.key === 'Enter') runAudit(); });

$('#demoLink').addEventListener('click', (e) => {
  e.preventDefault();
  $('#formCard').style.display = 'none';
